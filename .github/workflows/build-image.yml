name: build_image

env:
  version: ${{github.ref_name}}
  OS_URL:  https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img
  BASE_OS_IMAGE: base-os.img

on:
  push:
    tags:
      - '*'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: [self-hosted, Linux, kvm]
    container:
      image: ghcr.io/net-architect-cloud/docker-libguestfs-tools:latest
      options: --device=/dev/kvm --volume ${{ github.workspace }}/shared:/tmp/docker_shared
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download base image
        run: |
          wget "$OS_URL" -O $BASE_OS_IMAGE
      
      - name: Modify base OS image
        run: |
          qemu-img resize $BASE_OS_IMAGE +17.5G
          cp $BASE_OS_IMAGE $BASE_OS_IMAGE.bak
          virt-resize -expand /dev/sda1 $BASE_OS_IMAGE.bak $BASE_OS_IMAGE
          virt-customize -a $BASE_OS_IMAGE \
            --run-command 'grub-install /dev/sda' \
            --run-command 'apt purge snapd motd-news-config -y' \
            --run-command 'apt autopurge -y' \
            --run-command 'apt update' \
            --run-command 'apt full-upgrade -y' \
            --install bc,curl,dnsutils,figlet,htop,iotop,iperf,jq,less,lsb-release,lsof,man-db,mdadm,ncdu,net-tools,nmap,ntfs-3g,python3-utmp,rsync,telnet,wget,whois,zfsutils-linux \
            --run-command 'touch /etc/skel/.hushlogin' \
            --copy-in config/issue:/etc/ \
            --copy-in config/cloud.cfg:/etc/cloud/ \
            --copy-in dynamic-motd/update-motd.d:/etc/ \
            --copy-in config/10-cloud-rescue:/etc/update-motd.d/
 
      - name: Sysprep & Sparsify image
        run: |
            virt-sysprep -a $BASE_OS_IMAGE
            virt-sparsify --convert qcow2 --compress $BASE_OS_IMAGE cloud-rescue-${{ env.version }}-x86_64.qcow2
            md5sum cloud-rescue-${{ env.version }}-x86_64.qcow2 > md5.txt
            sha1sum -b cloud-rescue-${{ env.version }}-x86_64.qcow2 > sha1.txt
            sha256sum -b cloud-rescue-${{ env.version }}-x86_64.qcow2 > sha256.txt
            cp cloud-rescue-${{ env.version }}-x86_64.qcow2 /shared/
            cp md5.txt sha1.txt sha256.txt /shared/
