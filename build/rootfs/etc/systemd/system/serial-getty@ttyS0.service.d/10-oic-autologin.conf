# cloud-rescue: the serial console logs in as root without a password, so a VM whose
# network is broken can still be repaired. Console access already requires the cloud
# API (OpenStack console, Proxmox web UI): it is not exposed to the network.
[Service]
ExecStart=
ExecStart=-/sbin/agetty --autologin root --keep-baud 115200,57600,38400,9600 %I $TERM
